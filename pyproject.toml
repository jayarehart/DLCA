[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dlca"
version = "0.4.0"
description = "Dynamic life cycle assessment (DLCA) for buildings."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jay Arehart" }]
dependencies = [
    "numpy",
    "pandas",
    "pydantic>=2.11",
]

[project.urls]
Repository = "https://github.com/jayarehart/DLCA"

[tool.hatch.build.targets.wheel]
packages = ["src/dlca"]

[dependency-groups]
dev = [
    # pytest 9.2.0 crashes on Python 3.10 (INTERNALERROR in _pytest/nodeid.py); 9.1.x works.
    "pytest>=8,<9.2",
    "pytest-cov",
    "ruff",
    "pre-commit",
    "hypothesis>=6.168.5",
]

[tool.ruff]
line-length = 100
extend-exclude = ["legacy", "analysis"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing --durations=10"

[tool.coverage.run]
source = ["dlca"]

[tool.coverage.report]
# Reporting only; no fail_under threshold yet.
show_missing = true
