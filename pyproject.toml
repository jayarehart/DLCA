[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dlca"
version = "0.1.0.dev0"
description = "Dynamic life cycle assessment (DLCA) for buildings."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jay Arehart" }]
dependencies = [
    "numpy",
    "pandas",
]

[project.urls]
Repository = "https://github.com/jayarehart/DLCA"

[tool.hatch.build.targets.wheel]
packages = ["src/dlca"]
