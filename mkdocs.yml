site_name: DLCA
site_description: Dynamic life cycle assessment (DLCA) for buildings.
site_author: Jay Arehart
site_url: https://jayarehart.github.io/DLCA/
repo_url: https://github.com/jayarehart/DLCA
repo_name: jayarehart/DLCA
edit_uri: edit/main/docs/
copyright: Code released under the MIT License.

# The hook checks that the API pages document exactly the public names of
# record 0022, so `mkdocs build` fails if a name is added, removed or missed.
hooks:
  - docs/hooks/api_coverage.py
exclude_docs: |
  hooks/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      # LaTeX for MathJax on the methodology page (#98).
      generic: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      # Paths are from the repository root, so pages can include README-level
      # files (CHANGELOG.md, CITATION.cff, the packaged JSON Schemas) without
      # copying them. A missing file fails the build.
      base_path: ["."]
      check_paths: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_options:
              # A Returns section is one item; its wrapped lines are not new items.
              returns_multiple_items: false
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            heading_level: 3
  # The tutorials (#99) are committed without outputs and run during every
  # build, so `mkdocs build --strict` fails if a cell raises. No cache, so a
  # build always runs them against the current package.
  - mkdocs-jupyter:
      include: ["tutorials/*.ipynb"]
      # Skip the jupytext check of every Markdown page (none are notebooks).
      ignore: ["*.md"]
      execute: true
      allow_errors: false
      cache: false
      include_source: true
      # Markdown cells go through MkDocs, so links are checked and rewritten
      # and admonitions render as on the other pages.
      markdown_cell_processor: mkdocs

validation:
  omitted_files: info
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Install: install.md
  - Quick start: quickstart.md
  - Tutorials:
      - One material: tutorials/01_material.ipynb
      - An assembly over its life: tutorials/02_assembly.ipynb
      - A building, broken down: tutorials/03_building.ipynb
      - Scenarios: tutorials/04_scenarios.ipynb
  - Inputs: inputs.md
  - Methodology: methodology.md
  - API reference:
      - api/index.md
      - dlca: api/dlca.md
      - dlca.inventory: api/inventory.md
      - dlca.climate: api/climate.md
      - dlca.parameters: api/parameters.md
      - dlca.result: api/result.md
  - Decision records: decisions/README.md
  - Roadmap: roadmap.md
  - Changelog: changelog.md
  - Citing: citing.md
