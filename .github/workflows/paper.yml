name: Paper

# Builds the draft PDF of the JOSS paper (paper/paper.md, #102) with the Open
# Journals draft action, and uploads it as the "paper" artifact of the run.
# Runs only when the paper or this workflow changes. It is not a required
# check.

on:
  push:
    branches: [main]
    paths:
      - paper/**
      - .github/workflows/paper.yml
  pull_request:
    paths:
      - paper/**
      - .github/workflows/paper.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paper:
    name: draft PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build the draft PDF
        uses: openjournals/openjournals-draft-action@v1.0
        with:
          journal: joss
          paper-path: paper/paper.md
      # The action writes paper.pdf next to paper.md.
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: paper
          path: paper/paper.pdf
          if-no-files-found: error
