# Labels used in this repository. This file documents them; it is not
# applied automatically. Keep it in sync with `gh label list`.
# See AGENTS.md for how the workflow labels are used.

# Workflow
- name: agent-ready
  color: "0E8A16"
  description: "Spec complete; can be handed to an agent"
- name: needs-jay
  color: "D93F0B"
  description: "Waiting on a decision or data from the maintainer"
- name: science
  color: "5319E7"
  description: "Touches equations, parameters, timing, or reference data; deliberate lane"

# Internal review before v1.0 (milestone M5r, record 0023)
- name: review
  color: "FBCA04"
  description: "Finding from the internal review before v1.0"
- name: "review:blocker"
  color: "B60205"
  description: "Review finding: must be fixed before v1.0.0"
- name: "review:should-fix"
  color: "E99695"
  description: "Review finding: real problem, fix before v1.0 if cheap"
- name: "review:later"
  color: "F9E1A8"
  description: "Review finding: can wait past v1.0"

